<!-- index.html - Echo Buddy frontend -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Echo Buddy 🌿</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main card -->
    <div class="card basic-box">

        <!-- Corner decorations -->
        <div class="corner-deco top-left">🌿</div>
        <div class="corner-deco top-right">🌸</div>
        <div class="corner-deco bottom-left">🌸</div>
        <div class="corner-deco bottom-right">🍃</div>

        <!-- App Title -->
        <h1>Echo Buddy 🌿</h1>

        <!-- Display today's date -->
        <p class="date-text">📅 Missions for <span id="date"></span></p>

        <!-- Character Image -->
        <figure>
            <img id="buddyImage" src="assets/sad_globert.jpg" alt="Globert Wants You To Save The Planet!" width="250" height="225">
            <figcaption>Globert Wants You To Save The Planet One Goal at a Time!</figcaption>
        </figure>

        <!-- Daily missions heading -->
        <h2>♻️ Daily Missions ♻️</h2>

        <!-- Task list (will be populated dynamically) -->
        <ul class="task-list"></ul>

    </div>

    <!-- JS -->
    <script src="script.js"></script>
</body>
</html>
